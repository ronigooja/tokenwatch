database = "tokenwatch.db"
bearer_token = ""
signing_key = ""
upstream_factory = "tokenwatch.browser.factory:browser_upstream"
browser_config = "browser.local.toml"
# Browser request_timeout, close_timeout and blocked screenshot options belong in the private browser config; see its example.
request_interval = 30.0
request_jitter = 10.0
backoff_initial = 60.0
backoff_max = 3600.0
transfer_min_interval = 60.0
transfer_max_interval = 1800.0
transfer_retention_days = 30
snapshot_retention_days = 30
account_status_ttl = 600.0
novnc_url = ""
# vnc_password = ""
login_timeout = 900.0
# Keep below the systemd TimeoutStopSec, allowing time for resource cleanup.
shutdown_grace_seconds = 30.0

# Copy to browser.local.toml (git-ignored). Paths are relative to that file unless absolute.
# The signing key comes from the server settings, not from this file.
binary_path = "/path/to/fingerprint-chromium"
profiles_root = "profiles"
accounts_file = "accounts.local.toml"
max_instances = 1
idle_timeout = 60
# Total browser request deadline in seconds; must exceed the 30-second in-page fetch timeout.
request_timeout = 120
# Total time allowed for browser and proxy close before forced cleanup.
close_timeout = 5
cf_wait_seconds = 30
# Seconds per load-state wait; 0 disables settling and the recovery wait.
page_settle_seconds = 15
# Optional private screenshots; set both in browser.local.toml, outside the repository.
# blocked_screenshot_dir = "/var/lib/tokenwatch/blocked-screenshots"
# blocked_screenshot_keep = 10

[[accounts]]
id = "account-example"
proxy_url = "socks5h://USER:PASSWORD@proxy.example:1080"
fingerprint_seed = 123456
timezone = "America/New_York"
persona = "none"
# Only used by persona = "windows". Subset of font, audio, canvas, clientrects, gpu.
disable_spoofing = ["canvas"]

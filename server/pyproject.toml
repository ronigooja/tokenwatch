[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenwatch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.121,<1", "pydantic>=2.8,<3", "sqlalchemy>=2,<3", "uvicorn>=0.32,<1", "websockets>=13,<17", "httpx>=0.27,<1", "playwright>=1.51,<2", "pproxy==2.7.9"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["tokenwatch*"]
